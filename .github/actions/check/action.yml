name: Check
description: 安装依赖、类型检查、单测、前端构建（CI 与发布流水线共用）
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Typecheck
      shell: bash
      run: npx tsc --noEmit

    - name: Unit tests
      shell: bash
      run: node --test tests/*.test.ts

    - name: Build web
      shell: bash
      run: npx vite build

    - name: Install Chromium for UI smoke
      if: github.repository == 'JingFeng-code/AstraKibis'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - name: AstraKibis browser smoke (local test database)
      if: github.repository == 'JingFeng-code/AstraKibis'
      shell: bash
      run: node --no-warnings scripts/kibis-ui-smoke.mjs

    - name: Production dependency audit (fail closed)
      if: github.repository == 'JingFeng-code/AstraKibis'
      shell: bash
      run: |
        pnpm audit --prod --json > /tmp/kibis-audit.json || audit_status=$?
        cat /tmp/kibis-audit.json
        node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/kibis-audit.json','utf8'));const v=j.metadata?.vulnerabilities;if(!v||j.error)throw Error('Audit unavailable');console.log('[kibis-audit]',JSON.stringify(v));if(Object.values(v).some(n=>n>0))process.exit(1)"
        test "${audit_status:-0}" = 0
