name: Check
description: 安装依赖、类型检查、单测、前端构建（CI 与发布流水线共用）
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Resolve candidate lockfile (temporary development step)
      shell: bash
      run: |
        pnpm install --lockfile-only --no-frozen-lockfile
        echo KIBIS_LOCK_DIFF_BEGIN
        git diff -- pnpm-lock.yaml
        echo KIBIS_LOCK_DIFF_END

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Typecheck
      shell: bash
      run: npx tsc --noEmit

    - name: Unit tests
      shell: bash
      run: node --test tests/*.test.ts

    - name: Build web
      shell: bash
      run: npx vite build

    - name: Install Chromium for UI smoke
      if: github.repository == 'JingFeng-code/AstraKibis'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - name: AstraKibis browser smoke (local test database)
      if: github.repository == 'JingFeng-code/AstraKibis'
      shell: bash
      run: node --no-warnings scripts/kibis-ui-smoke.mjs

    - name: Production dependency audit (report only)
      if: github.repository == 'JingFeng-code/AstraKibis'
      shell: bash
      run: |
        pnpm audit --prod --json > /tmp/kibis-audit.json || true
        node -e "const fs=require('fs');const s=fs.readFileSync('/tmp/kibis-audit.json','utf8');try{const j=JSON.parse(s);console.log('[kibis-audit]',JSON.stringify({metadata:j.metadata,advisories:Object.values(j.advisories||{}).map(a=>({id:a.id,module:a.module_name,severity:a.severity,title:a.title,patched:a.patched_versions,url:a.url})),error:j.error}))}catch{console.log('[kibis-audit] audit unavailable; not a clean bill of health')}"
